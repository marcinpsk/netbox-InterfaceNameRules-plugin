[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "netbox-interface-name-rules"
version = "1.5.3"
description = "NetBox plugin for automatic interface renaming when modules are installed"
readme = "README.md"
requires-python = ">=3.12.0"
license = "Apache-2.0"
authors = [
    {name = "Marcin Zieba"},
]
keywords = [
    "netbox",
    "plugin",
    "dcim",
    "interface",
    "naming",
    "modules",
    "transceiver",
    "automation",
]
dependencies = [
    "google-re2>=1.1.20251105",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Framework :: Django",
    "Environment :: Plugins",
    "Topic :: System :: Networking",
]

[project.urls]
Homepage = "https://marcinpsk.github.io/netbox-InterfaceNameRules-plugin/"
Repository = "https://github.com/marcinpsk/netbox-InterfaceNameRules-plugin"
Issues = "https://github.com/marcinpsk/netbox-InterfaceNameRules-plugin/issues"
Documentation = "https://marcinpsk.github.io/netbox-InterfaceNameRules-plugin/"
Changelog = "https://github.com/marcinpsk/netbox-InterfaceNameRules-plugin/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["netbox_interface_name_rules*"]

[tool.setuptools.package-data]
netbox_interface_name_rules = ["templates/**/*", "static/**/*"]

# One source for every version this project installs. Each group is shaped around the job that
# installs it, so a workflow names a group and never a version. Dependabot's `uv` ecosystem updates
# these and `uv.lock`; it cannot see a version written into a workflow command.
[dependency-groups]
ci-tests = [
    "pytest>=9.0.2",
    "pytest-cov>=7.0",
    "pytest-django>=4.12",
    "pytest-xdist>=3.8",
    # pytest-xdist needs it to carry a traceback back from a worker.
    "tblib>=3.2.2",
]
lint = [
    "pre-commit>=4.5.1",
    "ruff>=0.16",
]
# `reuse lint` is a local `language: system` pre-commit hook, so it is needed wherever the full
# hook set runs, but not by the CI lint job. It ships no usable wheel, and the CI lint job installs
# `lint` with `--only-binary=:all:`, so it stays in its own group.
reuse = [
    "reuse>=6.2",
]
release = [
    "python-semantic-release>=10.6.2",
]
packaging = [
    "build>=1.4",
]
docs = [
    "mkdocs>=1,<2",
    "mkdocs-material>=9,<10",
]
dev = [
    {include-group = "ci-tests"},
    {include-group = "lint"},
    {include-group = "reuse"},
    {include-group = "release"},
    {include-group = "packaging"},
    "django>=5.1,<7.0",
]
# Installed into the NetBox virtualenv, so it carries tools only. A framework pin here would
# resolve against NetBox's own Django and could downgrade it for every session on the box.
devcontainer = [
    {include-group = "ci-tests"},
    {include-group = "lint"},
    {include-group = "reuse"},
    # A co-mounted plugin's conftest imports these for type names only, so no browser is downloaded.
    "pynetbox",
    "playwright",
]

[tool.pytest.ini_options]
pythonpath = ["/opt/netbox/netbox", "."]
DJANGO_SETTINGS_MODULE = "netbox_interface_name_rules.tests.isolated_settings"
addopts = "-n auto --dist loadscope --reuse-db --cov=netbox_interface_name_rules --cov-report=term-missing"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    "E", "F", "W", "D", "C901", "I", "RET", "UP",
    "A", "ASYNC", "B", "BLE", "C4", "DJ", "DTZ", "ERA", "EXE", "FLY", "FURB", "G",
    "ICN", "INP", "INT", "ISC", "LOG", "N", "PERF", "PGH", "PIE", "PLC", "PLE", "PLW",
    "PTH", "Q", "RSE", "RUF", "S", "SIM", "SLOT", "T10", "T20", "TC", "TID", "TRY", "YTT",
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "F403",   # star imports
    "F405",   # may be undefined from star import
    "D100",   # missing docstring in public module
    "D104",   # missing docstring in public package
    "D105",   # missing docstring in magic method
    "D106",   # missing docstring in public nested class (Django Meta, etc.)
    "D107",   # missing docstring in __init__
    "D203",   # 1 blank line before class docstring (conflicts with D211)
    "D213",   # multi-line summary second line (conflicts with D212)
    "TID252",  # package modules use relative imports consistently
    "PLC0415",  # lazy imports are deliberate: Django app loading order
    "TRY003",   # the message in a raise is the operator wording
]

# `×` in breakout notation (4×25G) and `–` in prose are deliberate, not homoglyphs.
allowed-confusables = ["×", "–"]

[tool.ruff.lint.mccabe]
# Flag errors (`C901`) whenever the complexity level exceeds 15.
max-complexity = 15

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"netbox_interface_name_rules.models._expression_names_channel".msg = "Use the name_template public interface."
"netbox_interface_name_rules.models._has_unbalanced_braces".msg = "Use the name_template public interface."
"netbox_interface_name_rules.models._references_channel".msg = "Use name_template.references_channel."
"netbox_interface_name_rules.models._validate_breakout_topology".msg = "Use name_template.validate_breakout_topology."
"netbox_interface_name_rules.naming._evaluate_arithmetic".msg = "Use name_template.evaluate_name_template."
"netbox_interface_name_rules.name_template._BINARY_OPERATORS".msg = "Use the name_template public interface."
"netbox_interface_name_rules.name_template._BUILT".msg = "Use the name_template public interface."
"netbox_interface_name_rules.name_template._CALLER".msg = "Use the name_template public interface."
"netbox_interface_name_rules.name_template._DEVICE".msg = "Use the name_template public interface."
"netbox_interface_name_rules.name_template._FORMAT_FIELD_RE".msg = "Use the name_template public interface."
"netbox_interface_name_rules.name_template._MEMBER".msg = "Use the name_template public interface."
"netbox_interface_name_rules.name_template._PARENT".msg = "Use the name_template public interface."
"netbox_interface_name_rules.name_template._UNARY_OPERATORS".msg = "Use the name_template public interface."
"netbox_interface_name_rules.name_template._EvaluatedField".msg = "Use the name_template public interface."
"netbox_interface_name_rules.name_template._ParsedBraceGroups".msg = "Use the name_template public interface."
"netbox_interface_name_rules.name_template._evaluate_arithmetic".msg = "Use name_template.evaluate_name_template."
"netbox_interface_name_rules.name_template._expression_names_channel".msg = "Use name_template.references_channel."
"netbox_interface_name_rules.name_template._has_unbalanced_braces".msg = "Use the name_template public interface."
"netbox_interface_name_rules.name_template._parse_brace_groups".msg = "Use the name_template public interface."
"netbox_interface_name_rules.name_template._parse_expression".msg = "Use the name_template public interface."

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]
# Django migrations declare mutable dependencies and operations.
"**/migrations/*.py" = ["D", "RUF012"]
# NetBox and Django contracts use mutable class attributes.
"netbox_interface_name_rules/{__init__,choices,filters,forms,models,tables,views}.py" = ["RUF012"]
# Serializer Meta fields are a framework contract.
"netbox_interface_name_rules/api/serializers.py" = ["RUF012"]
"netbox_interface_name_rules/name_template.py" = ["TID251"]
"**/tests/*.py" = ["D", "N806", "S101", "SIM117", "B018", "PTH", "T20"]
# Confusable characters are the fixture under test, not a mistake.
"**/tests/test_regex.py" = ["RUF001"]
# The module header draws the signal call graph; an inline noqa would break the
# comment-block baseline in test_comment_style.py.
"netbox_interface_name_rules/signals.py" = ["ERA001"]
# Dev-only scripts: settings modules are loaded by path, not imported as a package.
".devcontainer/**" = [
    "D", "B904", "BLE001", "INP001", "PTH", "S101", "S105", "S110", "S310",
    "S603", "S607", "T20", "TRY301",
]
".devcontainer/scripts/load-sample-data.py" = ["C901"]
".devcontainer/scripts/test-e2e.py" = ["C901"]
"performance/**" = ["T20"]
"scripts/**" = ["T20", "S101"]
# A console check: its printed report is what CI reads.
".github/scripts/**" = ["T20"]
# The guard under test is a shell script, so running it is the test.
"netbox_interface_name_rules/tests/test_network_pin_guard.py" = ["S603", "S607"]

[tool.coverage.run]
source = ["netbox_interface_name_rules"]
omit = ["*/migrations/*", "*/tests/*"]
branch = true

[tool.coverage.report]
fail_under = 97
show_missing = true

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
version_variables = ["netbox_interface_name_rules/__init__.py:__version__"]
commit_message = "chore(release): {version}\n\nAutomatically generated by python-semantic-release"
# The version bump lands in pyproject.toml, which uv.lock also records, so the lock is rebuilt
# here, after the bump and before the release commit, and `assets` puts it in that commit.
build_command = "uv lock && python -m build"
assets = ["uv.lock"]

[tool.semantic_release.branches.main]
match = "main"

[tool.semantic_release.publish]
upload_to_vcs_release = true

[tool.semantic_release.changelog.default_templates]
changelog_file = "CHANGELOG.md"

[tool.semantic_release.commit_parser_options]
allowed_tags = ["feat", "fix", "docs", "style", "refactor", "perf", "test", "build", "ci", "chore", "revert"]
minor_tags = ["feat"]
patch_tags = ["fix", "perf", "refactor"]
parse_squash_commits = true
