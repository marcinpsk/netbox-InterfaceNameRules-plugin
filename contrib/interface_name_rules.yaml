# Interface Name Rules
#
# Post-install interface rename rules for module types where NetBox's
# position-based naming can't produce the correct interface name.
#
# Template variables:
#   {slot}                — Top-level slot/module bay position
#   {bay_position}        — Position of the bay this module is installed into (raw)
#   {bay_position_num}    — Numeric suffix of bay position (e.g., "swp1" → "1")
#   {parent_bay_position} — Position of the parent module's bay
#   {sfp_slot}            — Numeric sub-bay index within the parent module
#   {base}                — Original interface name from NetBox template
#   {channel}             — Breakout channel number (iterated)
#
# Arithmetic expressions are supported inside braces:
#   {8 + ({parent_bay_position} - 1) * 2 + {sfp_slot}}
#
# Bulk import via: Interface Name Rules > Import

# =============================================================================
# Cisco 8201-SYS
# Bay format: "Transceiver 0/0/0/X" with position=X (numeric)
# =============================================================================

# 400G QSFP-DD transceivers → FourHundredGigE0/0/0/X
- module_type: QSFP-DD-400G-FR4
  device_type: 8201-SYS
  name_template: "FourHundredGigE0/0/0/{bay_position}"
  description: "Cisco 8201-SYS 400GE QSFP-DD naming"

- module_type: QSFP-DD-400G-LR4
