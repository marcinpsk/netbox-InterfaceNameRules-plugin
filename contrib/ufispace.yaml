#
# UfiSpace Interface Name Rules — Platform-scoped (OPTION A)
#
# Bulk import via: Interface Name Rules > Import
#
# UfiSpace whitebox switches (S9610-36D, S9610-46DX, S9700-53DX, etc.) run SONiC
# and use "swpX" interface naming where X is the transceiver bay number.
#
# Breakout ports on SONiC use the "swpXsY" convention where X is the bay number
# and Y is the channel index (0-based): swp1s0, swp1s1, swp1s2, swp1s3.
#
# ─── HOW RULE PRIORITY WORKS ─────────────────────────────────────────────────
#
# When a module is installed, the engine picks the SINGLE most specific matching
# rule using this cascade (highest score wins):
#
#   1. Exact module-type FK match always outranks regex at any scope.
#   2. Scope specificity (more constraints = higher priority):
#        parent_module_type set → +4 pts
#        device_type set        → +2 pts
#        platform set           → +1 pt
#   3. For regex rules: longer pattern beats shorter at the same scope.
#
# Examples for a QSFP-DD-400G-DR4 module in a S9610-36D device on SONiC:
#   Rule A: /.*/ platform=SONiC              → score 100+2=102  (pl, short)
#   Rule B: /QSFP-DD-400G-.*/ platform=SONiC → score 100+15=115 (pl, longer)
#   → Rule B wins (highest score). Rule A catches everything else.
#
# ⚠ WARNING: Don't mix device-type and platform rules for the same device.
#   A device-type rule at scope "dt" (score 2xx) always shadows a platform rule
#   at scope "pl" (score 1xx), even if the platform rule has a more specific
#   pattern. Choose ONE approach: platform-scoped (this file) OR device-type-scoped
#   (see ufispace-device-type.yaml).
#
# ─────────────────────────────────────────────────────────────────────────────
#
# OPTION A — Platform-scoped rules (this file)
#   Requires: a "SONiC" Platform object in NetBox.
#   Advantages: one set of rules covers ALL UfiSpace models automatically.
#   Use this if you tag all SONiC devices with the SONiC platform object.
#
# For device-type-scoped rules (no Platform required), use ufispace-device-type.yaml.
#
# Load ONLY ONE of the two files to avoid ambiguity.

# =============================================================================
# Platform-scoped rules (requires Platform "SONiC" in NetBox)
# =============================================================================

# Generic: all other module types → swpX
- module_type_pattern: ".*"
  module_type_is_regex: true
  platform: SONiC
  name_template: "swp{bay_position_num}"
  description: "UfiSpace SONiC — generic naming (catches everything not covered by breakout rules)"

# QSFP-DD 400G breakout to 4×100G on SONiC → swpXs0 … swpXs3
# Priority: longer pattern (15 chars) beats .* (2 chars) at same platform scope
- module_type_pattern: "QSFP-DD-400G-.*"
  module_type_is_regex: true
  platform: SONiC
  name_template: "swp{bay_position_num}s{channel}"
  channel_count: 4
  channel_start: 0
  description: "UfiSpace SONiC — QSFP-DD 400G 4×100G breakout (swpXs0..swpXs3)"

# QSFP28 100G breakout to 4×25G on SONiC → swpXs0 … swpXs3
# Priority: longer pattern (11 chars) beats .* (2 chars) at same platform scope
- module_type_pattern: "QSFP-100G-.*"
  module_type_is_regex: true
  platform: SONiC
  name_template: "swp{bay_position_num}s{channel}"
  channel_count: 4
  channel_start: 0
  description: "UfiSpace SONiC — QSFP28 100G 4×25G breakout (swpXs0..swpXs3)"
