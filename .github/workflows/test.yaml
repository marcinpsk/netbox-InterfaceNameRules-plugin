name: Test with supported NetBox and Python versions

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-netbox:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
        netbox-version: ["main", "v4.5.3", "v4.4.10"]
        include:
          - python-version: "3.14"
            netbox-version: "main"

    services:
      redis:
        image: redis
        ports:
          - 6379:6379

      postgres:
        image: postgres
        env:
          POSTGRES_USER: netbox
          POSTGRES_PASSWORD: netbox
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          path: netbox-InterfaceNameRules-plugin

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Checkout NetBox
        uses: actions/checkout@v4
        with:
          repository: "netbox-community/netbox"
          path: netbox
          ref: ${{ matrix.netbox-version }}

      - name: Install NetBox and plugin
        working-directory: netbox-InterfaceNameRules-plugin
        run: |
          uv pip install --system -e .
          uv pip install --system pytest pytest-django tblib
          uv pip install --system -r ../netbox/requirements.txt

      - name: Set up NetBox configuration
        working-directory: netbox
        run: |
          cat > netbox/netbox/configuration.py << 'EOF'
          ALLOWED_HOSTS = ['*']
          DATABASE = {
              'NAME': 'netbox',
              'USER': 'netbox',
              'PASSWORD': 'netbox',
              'HOST': 'localhost',
              'PORT': '',
              'CONN_MAX_AGE': 300,
              'ENGINE': 'django.db.backends.postgresql'
          }
          REDIS = {
              'tasks': {'HOST': 'localhost', 'PORT': 6379, 'DATABASE': 0},
              'caching': {'HOST': 'localhost', 'PORT': 6379, 'DATABASE': 1}
          }
          SECRET_KEY = 'test-secret-key-not-for-production-1234567890123456'
          PLUGINS = ['netbox_interface_name_rules']
          EOF

      - name: Run tests
        working-directory: netbox/netbox
        env:
          NETBOX_CONFIGURATION: netbox.configuration
        run: |
          python manage.py test netbox_interface_name_rules --verbosity=2
