name: Test with supported NetBox and Python versions

on:
  push:
    branches:
      - main  # Only direct pushes to main; branch pushes with open PRs are covered by the pull_request trigger
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-netbox:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        # One Python per NetBox release rather than the cross-product. NetBox is the axis that
        # changes the models and API this plugin binds to; the plugin itself is pure Python and
        # Django ORM, and no Python-axis cell has ever caught a plugin bug here. Each supported
        # Python is still exercised once, oldest against oldest and newest against newest.
        include:
          - python-version: "3.12"
            netbox-version: "v4.3.7"
          - python-version: "3.13"
            netbox-version: "v4.5.3"
          - python-version: "3.14"
            netbox-version: "v4.7.0"
          # Early warning for upcoming NetBox changes. Non-blocking: unreleased NetBox breaks
          # for reasons that are not ours, so this must not gate a PR.
          - python-version: "3.13"
            netbox-version: "main"
            experimental: true
          # The feature branch carries the next minor release. Non-blocking, same reason.
          - python-version: "3.13"
            netbox-version: "feature"
            experimental: true

    continue-on-error: ${{ matrix.experimental || false }}

    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379

      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: netbox
          POSTGRES_PASSWORD: netbox
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: netbox-InterfaceNameRules-plugin
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Checkout NetBox
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: "netbox-community/netbox"
          path: netbox
          ref: ${{ matrix.netbox-version }}
          persist-credentials: false

      - name: Install NetBox and plugin
        working-directory: netbox-InterfaceNameRules-plugin
        run: |
          uv pip install --system -r ../netbox/requirements.txt
          uv pip install --system --only-binary=:all: pytest==9.0.2 pytest-cov==7.0.0 pytest-django==4.12.0 pytest-xdist==3.8.0 tblib==3.2.2
          uv pip install --system -e .

      - name: Set up NetBox configuration
        working-directory: netbox
        run: |
          cat > netbox/netbox/configuration.py << 'EOF'
          ALLOWED_HOSTS = ['*']
          DATABASE = {
              'NAME': 'netbox',
              'USER': 'netbox',
              'PASSWORD': 'netbox',
              'HOST': 'localhost',
              'PORT': '',
              'CONN_MAX_AGE': 300,
              'ENGINE': 'django.db.backends.postgresql'
          }
          REDIS = {
              'tasks': {'HOST': 'localhost', 'PORT': 6379, 'DATABASE': 0},
              'caching': {'HOST': 'localhost', 'PORT': 6379, 'DATABASE': 1}
          }
          SECRET_KEY = 'test-secret-key-not-for-production-1234567890123456'
          API_TOKEN_PEPPERS = {0: 'aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa'}
          PLUGINS = ['netbox_interface_name_rules']
          EOF

      - name: Run tests with coverage
        working-directory: netbox-InterfaceNameRules-plugin
        env:
          NETBOX_CONFIGURATION: netbox.configuration
          PYTHONPATH: ${{ github.workspace }}/netbox/netbox
          COVERAGE_RCFILE: pyproject.toml
          TEST_DB_NAME: test_netbox_interface_name_rules_ci
          TEST_REDIS_HOST: localhost
          # Turns the channelization tests' skipUnless guard into an assertion on the leg that must
          # have the feature, so a broken probe cannot silently skip the whole file.
          EXPECT_NETBOX_CHANNELIZATION: ${{ (matrix.netbox-version == 'feature' || matrix.netbox-version == 'v4.7.0') && '1' || '' }}
          # A query count belongs to one NetBox release, and the baseline file holds one value per
          # key. The top supported version is the only leg that asserts it. Every other cell records
          # its count in this disposable checkout, so it reports plugin compatibility failures
          # instead of baseline drift. Bumping the top version means editing the matrix above, this
          # condition, and tests/query_counts.json together.
          UPDATE_QUERY_COUNTS: ${{ matrix.netbox-version != 'v4.7.0' && '1' || '' }}
        run: |
          pytest -n auto netbox_interface_name_rules -o pythonpath=../netbox/netbox

      - name: Generate coverage report
        if: matrix.netbox-version == 'v4.5.3'
        working-directory: netbox-InterfaceNameRules-plugin
        env:
          COVERAGE_RCFILE: pyproject.toml
        run: |
          mkdir -p ../coverage-report
          coverage json -o ../coverage-report/coverage.json
          coverage html -d ../coverage-report/htmlcov
          coverage xml -o ../coverage-report/coverage.xml

      - name: Upload coverage report
        if: matrix.netbox-version == 'v4.5.3'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: coverage-report
          path: coverage-report/
          retention-days: 7

      - name: Upload coverage to Codecov
        if: matrix.netbox-version == 'v4.5.3'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f  # v7.0.0
        with:
          files: coverage-report/coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
