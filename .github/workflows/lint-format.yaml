name: Lint and Format

on:
  push:
  pull_request:

jobs:
  format-and-lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: 'uv pip install --system --only-binary=:all: pre-commit==4.5.1 ruff==0.16.0'

      - name: Run Ruff linting
        run: ruff check .

      - name: Run Ruff formatting check
        run: ruff format --check .

      # Runs the pinned hook from .pre-commit-config.yaml, so the version lives in one place.
      - name: Audit the workflows
        run: pre-commit run --all-files zizmor

      - name: Run devcontainer script tests
        run: |
          bash .devcontainer/scripts/tests/test-debug-toolbar-patches.sh
          bash .devcontainer/scripts/tests/test-network-pins.sh
