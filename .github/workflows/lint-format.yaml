name: Lint and Format

on:
  push:
  pull_request:

jobs:
  format-and-lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        shell: bash
        run: |
          uv export --system-certs --locked --only-group lint --no-emit-project --format requirements-txt | \
            uv pip install --system-certs --system --only-binary=:all: --require-hashes -r /dev/stdin

      - name: Check the lockfile is current
        run: uv lock --check

      - name: Run Ruff linting
        run: ruff check .

      - name: Run Ruff formatting check
        run: ruff format --check .

      # Runs the pinned hook from .pre-commit-config.yaml, so the version lives in one place.
      - name: Audit the workflows
        run: pre-commit run --all-files zizmor

      - name: Run devcontainer script tests
        run: |
          bash .devcontainer/scripts/tests/test-debug-toolbar-patches.sh
          bash .devcontainer/scripts/tests/test-ca-environment.sh
          bash .devcontainer/scripts/tests/test-network-pins.sh
          bash .devcontainer/scripts/tests/test-bytecode-writes.sh
          bash .devcontainer/scripts/tests/test-netbox-test-targets.sh
