name: Release

"on":
  push:
    branches:
      - main

jobs:
  semantic-release:
    name: Semantic Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    # semantic-release writes these to $GITHUB_OUTPUT; tag is the new tag when released is true.
    outputs:
      released: ${{ steps.release.outputs.released }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Checkout
        # zizmor: ignore[artipacked] semantic-release pushes the release commit and tag,
        # so this checkout has to keep its credential.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      # actions/checkout uses --no-tags internally, which can prevent
      # annotated tag objects from being fetched even with fetch-tags.
      # Re-fetch explicitly so gitpython (used by semantic-release) can
      # dereference annotated tags to their target commits.
      # See: https://github.com/actions/checkout/issues/2309
      - name: Fetch tags
        run: git fetch --tags --force

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2

      - name: Install dependencies
        run: uv sync --locked --no-build --only-group release --only-group packaging

      - name: Run semantic-release
        id: release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: uv run --no-sync --no-build semantic-release version --changelog --push --vcs-release

  # It runs after semantic-release creates the GitHub release, which the latest-release check of the deploy reads.
  # A failed deploy leaves the release in place: re-run the failed jobs, or dispatch docs-deploy.yaml with the tag.
  docs:
    needs: semantic-release
    if: needs.semantic-release.outputs.released == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/docs-deploy.yaml
    with:
      tag: ${{ needs.semantic-release.outputs.tag }}
