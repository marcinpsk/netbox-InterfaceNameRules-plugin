name: Release

"on":
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  semantic-release:
    name: Semantic Release
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.release.outputs.released }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@eac588ad8def6316056a12d4907a9d4d84ff7a3b  # v7

      - name: Install dependencies
        run: uv sync --group dev

      - name: Debug tag resolution
        run: |
          echo "=== Tag ref and commit ==="
          git rev-parse v1.0.0 || echo "tag parse failed"
          git rev-parse v1.0.0^{commit} || echo "tag deref failed"
          echo "=== Python tag check ==="
          .venv/bin/python3 -c "
          import git
          repo = git.Repo('.')
          print(f'active_branch: {repo.active_branch}')
          for tag in repo.tags:
              print(f'Tag: {tag.name}')
              print(f'  tag.commit type: {type(tag.commit)}')
              print(f'  tag.commit.hexsha: {tag.commit.hexsha}')
              print(f'  tag.object type: {type(tag.object)}')
              print(f'  tag.object sha: {tag.object.hexsha}')
          from semantic_release.version.algorithm import _traverse_graph_for_commits
          head = repo.active_branch.commit
          all_c = _traverse_graph_for_commits(head_commit=head)
          hashes = {c.hexsha for c in all_c}
          print(f'Total commits in DFS: {len(all_c)}')
          for tag in repo.tags:
              in_set = tag.commit.hexsha in hashes
              print(f'Tag {tag.name} commit {tag.commit.hexsha[:7]} in set: {in_set}')
          "

      - name: Run semantic-release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BEFORE=$(git describe --tags --abbrev=0 2>/dev/null || echo "none")
          uv run semantic-release -vv version --changelog --push
          AFTER=$(git describe --tags --abbrev=0 2>/dev/null || echo "none")
          if [ "$BEFORE" != "$AFTER" ]; then
            echo "released=true" >> $GITHUB_OUTPUT
            echo "tag=$AFTER" >> $GITHUB_OUTPUT
          else
            echo "released=false" >> $GITHUB_OUTPUT
          fi

  publish:
    name: Publish to PyPI
    needs: semantic-release
    if: needs.semantic-release.outputs.released == 'true'
    uses: ./.github/workflows/publish-pypi.yaml
    with:
      tag: ${{ needs.semantic-release.outputs.tag }}
    permissions:
      id-token: write
      contents: read
