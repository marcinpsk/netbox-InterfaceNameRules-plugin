<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Background rounded square -->
  <rect width="64" height="64" rx="12" fill="#1565c0"/>

  <!-- Module bay slot (outer rectangle) -->
  <rect x="6" y="18" width="52" height="28" rx="4" fill="none" stroke="#90caf9" stroke-width="2"/>

  <!-- SFP/module connector housing (inner left) -->
  <rect x="9" y="23" width="18" height="18" rx="2" fill="#1976d2" stroke="#42a5f5" stroke-width="1.5"/>
  <!-- Connector pins -->
  <rect x="11" y="26" width="2" height="12" rx="1" fill="#90caf9"/>
  <rect x="15" y="26" width="2" height="12" rx="1" fill="#90caf9"/>
  <rect x="19" y="26" width="2" height="12" rx="1" fill="#90caf9"/>
  <rect x="23" y="26" width="2" height="12" rx="1" fill="#90caf9"/>

  <!-- Rename arrow (right side) -->
  <path d="M34 29 L48 29" stroke="#ffd740" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="48,26 53,29 48,32" fill="#ffd740"/>

  <!-- Interface label tag below arrow -->
  <rect x="34" y="34" width="20" height="7" rx="2" fill="#0d47a1" stroke="#ffd740" stroke-width="1"/>
  <line x1="37" y1="37.5" x2="51" y2="37.5" stroke="#90caf9" stroke-width="1.2" stroke-linecap="round"/>
</svg>
