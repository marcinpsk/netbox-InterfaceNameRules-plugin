# The browser suite that writes the documentation media. This file makes it the rootdir, so the
# Django settings, the coverage and the conftest.py of the repository root stay out of the run.
[pytest]
addopts = -p no:django -p no:cacheprovider --browser chromium
base_url = http://127.0.0.1:8000
